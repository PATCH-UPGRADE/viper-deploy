# Local development stack: compose-aws.yml minus Caddy, so VIPER is reached directly at
# http://localhost:3000. Run it with: export VIPER_TARGET=dev && just start
#
# The project name matches compose-aws.yml so both targets use the same volume names.
name: viper

networks:
  viper_stack:
    driver: bridge

services:
  postgres:
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viper
      POSTGRES_NON_DEFAULT_DB: blueflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - viper_stack

  viper:
    image: ghcr.io/patch-upgrade/viper:${VIPER_VERSION:-latest}
    platform: ${VIPER_PLATFORM:-linux/amd64}
    env_file:
      - .env
    volumes:
      - viper-stamps:/srv/stamps
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - viper_stack

  inngest:
    image: docker.io/inngest/inngest:v1.17.2
    environment:
      INNGEST_BOOTSTRAP_URL: http://viper:3000/api/inngest
      INNGEST_DEV: true
      INNGEST_PORT: 8288
    ports:
      - "8288:8288"
    entrypoint: ["/bin/sh", "-c"]
    command: ["inngest dev -u $$INNGEST_BOOTSTRAP_URL"]
    depends_on:
      - viper
    networks:
      - viper_stack

  blueflow-postgres:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: blueflow
      POSTGRES_USER: blueflow
      POSTGRES_PASSWORD: blueflow
    volumes:
      - blueflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viper_stack

  blueflow-redis:
    image: docker.io/redis:7-alpine
    volumes:
      - blueflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 6379:6379
    networks:
      - viper_stack

  blueflow:
    image: docker.io/virtalabsinc/blueflow:latest
    # amd64 only; runs under emulation on Apple Silicon
    platform: ${BLUEFLOW_PLATFORM:-linux/amd64}
    volumes:
      - ./blueflow-init:/blueflow-init:ro
    depends_on:
      blueflow-postgres:
        condition: service_healthy
      blueflow-redis:
        condition: service_healthy
    environment:
      BASE_URL: http://blueflow:8000
      DATABASE_URL: postgresql://blueflow:blueflow@blueflow-postgres:5432/blueflow
      REDIS_URL: redis://blueflow-redis:6379/0
      CELERY_BROKER_URL: redis://blueflow-redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: true
      DJANGO_SETTINGS_MODULE: project.settings.development
      DJANGO_SECRET_KEY: demo-not-for-production
      DJANGO_ALLOWED_HOSTS: blueflow,localhost,127.0.0.1,*
      VIPER_CALLBACK_ALLOWED_HOSTS: viper
      VIPER_CALLBACK_TIMEOUT: 30
      API_TOKEN: ${BLUEFLOW_API_TOKEN:-demo-not-for-production}
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ['CMD-SHELL', '/app/.venv/bin/python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/api/\").getcode() < 400 else 1)"']
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "8000:8000"
    networks:
      - viper_stack

  blueflow-worker:
    image: docker.io/virtalabsinc/blueflow:latest
    platform: ${BLUEFLOW_PLATFORM:-linux/amd64}
    depends_on:
      blueflow:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blueflow:blueflow@blueflow-postgres:5432/blueflow
      REDIS_URL: redis://blueflow-redis:6379/0
      CELERY_BROKER_URL: redis://blueflow-redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: true
      DJANGO_SETTINGS_MODULE: project.settings.development
      SECRET_KEY: demo-not-for-production
    command:  ["uv", "run", "celery", "-A", "blueflow.celery", "worker", "-l", "info"]
    networks:
      - viper_stack

volumes:
  pgdata:
  viper-stamps:
  blueflow-pgdata:
  blueflow-redis-data:
